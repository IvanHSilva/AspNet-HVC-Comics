
# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
#
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy ASP.NET Core app to Azure Web App - app-hvc-comics

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build and Publish
    runs-on: windows-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # .NET
      # --------------------------------------------------------

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Show .NET version
        run: dotnet --info

      # --------------------------------------------------------
      # CLEAN PREVIOUS BUILD
      # --------------------------------------------------------

      - name: Clean previous build
        shell: pwsh
        run: |
          Remove-Item HVC-Comics/bin `
            -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item HVC-Comics/obj `
            -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item "${{ github.workspace }}\publish" `
            -Recurse -Force -ErrorAction SilentlyContinue

      # --------------------------------------------------------
      # RESTORE
      # --------------------------------------------------------

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore `
            HVC-Comics/HVC-Comics.csproj `
            --runtime win-x64 `
            -p:SelfContained=true

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # --------------------------------------------------------
      # BUILD
      # --------------------------------------------------------

      - name: Build
        shell: pwsh
        run: |
          dotnet build `
            HVC-Comics/HVC-Comics.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # --------------------------------------------------------
      # PUBLISH
      #
      # Self-contained Windows x64
      #
      # Comics.json is excluded by the .csproj:
      #
      # <CopyToPublishDirectory>Never</CopyToPublishDirectory>
      # --------------------------------------------------------

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish `
            HVC-Comics/HVC-Comics.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "${{ github.workspace }}\publish"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # --------------------------------------------------------
      # VERIFY SELF-CONTAINED PUBLISH
      # --------------------------------------------------------

      - name: Verify self-contained publish
        shell: pwsh
        run: |

          $publish = "${{ github.workspace }}\publish"

          Write-Host "=========================================="
          Write-Host "VERIFYING SELF-CONTAINED PUBLISH"
          Write-Host "=========================================="

          $requiredFiles = @(
            "HVC-Comics.exe",
            "HVC-Comics.dll",
            "web.config",
            "hostfxr.dll",
            "hostpolicy.dll",
            "coreclr.dll"
          )

          foreach ($file in $requiredFiles) {

            $path = Join-Path $publish $file

            if (-not (Test-Path $path)) {
              throw "Required file missing: $file"
            }

            Write-Host "OK: $file"

          }

          Write-Host ""
          Write-Host "Checking web.config..."

          $webConfig = Join-Path $publish "web.config"

          [xml]$config = Get-Content $webConfig -Raw

          $aspNetCore = $config.SelectSingleNode("//aspNetCore")

          if ($null -eq $aspNetCore) {
            throw "aspNetCore configuration not found."
          }

          $processPath = $aspNetCore.GetAttribute("processPath")

          Write-Host "ProcessPath: $processPath"

          if ($processPath -notmatch '\.exe$') {
            throw "Publish is not configured as self-contained."
          }

          Write-Host "OK: Self-contained web.config."

          Write-Host ""
          Write-Host "Checking Comics.json..."

          $comicsFile = Join-Path $publish "Data\Comics.json"

          if (Test-Path $comicsFile) {
            throw "ERROR: Comics.json was included in publish."
          }

          Write-Host "OK: Comics.json is NOT included."

          Write-Host ""
          Write-Host "Checking publish architecture..."

          $exe = Get-Item (Join-Path $publish "HVC-Comics.exe")

          Write-Host "Executable size: $($exe.Length) bytes"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PUBLISH VERIFICATION COMPLETED"
          Write-Host "=========================================="

      # --------------------------------------------------------
      # SHOW PUBLISHED FILES
      # --------------------------------------------------------

      - name: Show published files
        shell: pwsh
        run: |

          $publish = "${{ github.workspace }}\publish"

          Write-Host "=========================================="
          Write-Host "PUBLISHED FILES"
          Write-Host "=========================================="

          Get-ChildItem `
            -Path $publish `
            -Recurse `
            -File |
            Sort-Object FullName |
            Select-Object FullName

          Write-Host ""
          Write-Host "Publish size:"

          $size = (
            Get-ChildItem `
              -Path $publish `
              -Recurse `
              -File |
            Measure-Object -Property Length -Sum
          ).Sum

          "{0:N2} MB" -f ($size / 1MB)

      # --------------------------------------------------------
      # CREATE ZIP
      # --------------------------------------------------------

      - name: Create deployment package
        shell: pwsh
        run: |

          $publish = "${{ github.workspace }}\publish"
          $package = "${{ github.workspace }}\hvc-comics.zip"

          if (Test-Path $package) {
            Remove-Item $package -Force
          }

          Compress-Archive `
            -Path "$publish\*" `
            -DestinationPath $package `
            -Force

          Write-Host "=========================================="
          Write-Host "DEPLOYMENT PACKAGE"
          Write-Host "=========================================="

          Get-Item $package |
            Select-Object Name, Length

      # --------------------------------------------------------
      # UPLOAD ARTIFACT
      # --------------------------------------------------------

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: hvc-comics-azure
          path: ${{ github.workspace }}/hvc-comics.zip
          if-no-files-found: error


  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    name: Deploy to Azure Web App

    runs-on: windows-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # DOWNLOAD ARTIFACT
      # --------------------------------------------------------

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: hvc-comics-azure
          path: ${{ github.workspace }}

      # --------------------------------------------------------
      # VERIFY ARTIFACT
      # --------------------------------------------------------

      - name: Verify deployment package
        shell: pwsh
        run: |

          $package = "${{ github.workspace }}\hvc-comics.zip"

          Write-Host "=========================================="
          Write-Host "VERIFYING DEPLOYMENT PACKAGE"
          Write-Host "=========================================="

          if (-not (Test-Path $package)) {
            throw "Deployment package not found."
          }

          Get-Item $package |
            Select-Object Name, Length

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::OpenRead($package)

          try {

            $entries = $zip.Entries

            $requiredFiles = @(
              "HVC-Comics.exe",
              "HVC-Comics.dll",
              "web.config",
              "hostfxr.dll",
              "hostpolicy.dll",
              "coreclr.dll"
            )

            foreach ($file in $requiredFiles) {

              $entry = $entries |
                Where-Object {
                  $_.FullName -eq $file
                }

              if (-not $entry) {
                throw "Required file missing from ZIP: $file"
              }

              Write-Host "OK: $file"

            }

            $comics = $entries |
              Where-Object {
                $_.FullName -match '(^|/)Data/Comics\.json$'
              }

            if ($comics) {
              throw "ERROR: Comics.json exists inside deployment package."
            }

            Write-Host "OK: Comics.json is not present."

          }
          finally {

            $zip.Dispose()

          }

          Write-Host "Deployment package verified successfully."

      # --------------------------------------------------------
      # LOGIN AZURE
      # --------------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4BF12489E2DB4A20AE693B56EAFC1BFC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A65E51AAFF9E4B78A5CEFC2D4485A555 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_62DD59A9D20E442E988B0D25DB87D616 }}

      # --------------------------------------------------------
      # DEPLOY
      # --------------------------------------------------------

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-hvc-comics'
          slot-name: 'Production'
          package: ${{ github.workspace }}/hvc-comics.zip
