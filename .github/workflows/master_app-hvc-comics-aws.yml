name: Build and deploy ASP.Net Core app to AWS EC2 - hvc-comics

on:
push:
branches:
- master
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
permissions:
contents: read

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '10.x'

  - name: Restore
    run: dotnet restore HVC-Comics/HVC-Comics.csproj

  - name: Build
    run: dotnet build HVC-Comics/HVC-Comics.csproj --configuration Release --no-restore

  - name: Publish
    run: dotnet publish HVC-Comics/HVC-Comics.csproj --configuration Release --no-build -o ./publish

  - name: Create deployment package
    run: |
      tar -czf hvc-comics.tar.gz -C ./publish .

  - name: Upload deployment package
    uses: actions/upload-artifact@v4
    with:
      name: hvc-comics-package
      path: hvc-comics.tar.gz


deploy:
runs-on: ubuntu-latest
needs: build
permissions:
contents: read

steps:
  - name: Download deployment package
    uses: actions/download-artifact@v4
    with:
      name: hvc-comics-package

  - name: Configure SSH
    env:
      AWS_EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
      AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
    run: |
      mkdir -p ~/.ssh

      printf '%s\n' "$AWS_EC2_SSH_KEY" > ~/.ssh/aws_ec2_key

      chmod 600 ~/.ssh/aws_ec2_key

      ssh-keyscan -H "$AWS_EC2_HOST" >> ~/.ssh/known_hosts

  - name: Upload package to EC2
    env:
      AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
      AWS_EC2_USER: ${{ secrets.AWS_EC2_USER }}
    run: |
      scp \
        -i ~/.ssh/aws_ec2_key \
        hvc-comics.tar.gz \
        "$AWS_EC2_USER@$AWS_EC2_HOST:/tmp/hvc-comics.tar.gz"

  - name: Deploy on EC2
    env:
      AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
      AWS_EC2_USER: ${{ secrets.AWS_EC2_USER }}
    run: |
      ssh \
        -i ~/.ssh/aws_ec2_key \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "bash -s" << 'REMOTE_SCRIPT'

      set -e

      APP_DIR="/var/www/hvc-comics"
      PACKAGE="/tmp/hvc-comics.tar.gz"

      echo "Checking application directory..."

      if [ ! -d "$APP_DIR" ]; then
          echo "ERROR: Application directory not found:"
          echo "$APP_DIR"
          exit 1
      fi

      echo "Checking Comics.json..."

      if [ ! -f "$APP_DIR/Data/Comics.json" ]; then
          echo "ERROR: Data/Comics.json not found."
          echo "Deployment aborted to protect the existing data."
          exit 1
      fi

      echo "Creating temporary deployment directory..."

      TMP_DIR=$(mktemp -d)

      echo "Extracting package..."

      tar -xzf "$PACKAGE" -C "$TMP_DIR"

      echo "Stopping application..."

      sudo systemctl stop hvc-comics

      echo "Updating application files..."

      find "$TMP_DIR" -mindepth 1 -maxdepth 1 ! -name Data -exec cp -a {} "$APP_DIR/" \;

      echo "Updating application Data directory..."

      if [ -d "$TMP_DIR/Data" ]; then
          find "$TMP_DIR/Data" -mindepth 1 ! -name Comics.json -exec cp -a {} "$APP_DIR/Data/" \;
      fi

      echo "Starting application..."

      sudo systemctl start hvc-comics

      echo "Checking application status..."

      if ! sudo systemctl is-active --quiet hvc-comics; then
          echo "ERROR: Application failed to start."

          sudo journalctl \
            -u hvc-comics \
            -n 50 \
            --no-pager

          rm -rf "$TMP_DIR"

          exit 1
      fi

      echo "Cleaning temporary files..."

      rm -rf "$TMP_DIR"
      rm -f "$PACKAGE"

      echo "=========================================="
      echo "HVC-Comics AWS deployment completed"
      echo "=========================================="

      REMOTE_SCRIPT

  - name: Deployment summary
    run: |
      echo "AWS EC2 deployment completed successfully."
      echo "Commit: ${{ github.sha }}"
