name: Build and deploy ASP.NET Core app to AWS EC2 - HVC Comics

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Show .NET version
        run: dotnet --info

      - name: Restore
        run: dotnet restore HVC-Comics/HVC-Comics.csproj

      - name: Build
        run: |
          dotnet build \
            HVC-Comics/HVC-Comics.csproj \
            --configuration Release \
            --no-restore

      - name: Publish
        run: |
          dotnet publish \
            HVC-Comics/HVC-Comics.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: Verify publish
        run: |
          echo "Published files:"
          find ./publish -maxdepth 2 -type f | sort

          echo ""
          echo "Publish size:"
          du -sh ./publish

      - name: Remove server data from artifact
        run: |
          rm -rf ./publish/Data

      - name: Create deployment archive
        run: |
          tar -czf hvc-comics.tar.gz -C ./publish .

          echo "Archive created:"
          ls -lh hvc-comics.tar.gz

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: hvc-comics-publish
          path: hvc-comics.tar.gz


  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs: build

    permissions:
      contents: read

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: hvc-comics-publish

      - name: Verify artifact
        run: |
          ls -lah
          tar -tzf hvc-comics.tar.gz | head -50

      - name: Configure SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.AWS_EC2_SSH_KEY }}" \
            > ~/.ssh/hvc-comics-key

          chmod 600 ~/.ssh/hvc-comics-key

          ssh-keyscan -H "${{ secrets.AWS_EC2_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/hvc-comics-key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}" \
            "echo SSH connection successful"

      - name: Upload application
        run: |
          scp \
            -i ~/.ssh/hvc-comics-key \
            -o ConnectTimeout=15 \
            hvc-comics.tar.gz \
            "${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/tmp/hvc-comics.tar.gz"

      - name: Deploy application
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/hvc-comics-key \
            "${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          APP_DIR="/opt/hvc-comics"
          PUBLISH_DIR="$APP_DIR/publish"
          BACKUP_DIR="/tmp/hvc-comics-backup"
          ARCHIVE="/tmp/hvc-comics.tar.gz"

          SERVICE="hvc-comics.service"

          echo "=========================================="
          echo "HVC Comics - AWS deployment"
          echo "=========================================="

          echo "Checking directories..."

          if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: $APP_DIR does not exist."
              exit 1
          fi

          if [ ! -d "$PUBLISH_DIR" ]; then
              echo "ERROR: $PUBLISH_DIR does not exist."
              exit 1
          fi

          if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: Deployment archive does not exist."
              exit 1
          fi

          echo "Checking archive..."

          tar -tzf "$ARCHIVE" > /dev/null

          echo "Archive is valid."

          echo "Stopping application..."

          sudo systemctl stop "$SERVICE"

          echo "Creating backup..."

          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"

          if [ -f "$PUBLISH_DIR/Data/Comics.json" ]; then
              echo "Backing up Comics.json..."

              cp \
                "$PUBLISH_DIR/Data/Comics.json" \
                "$BACKUP_DIR/Comics.json"

          else
              echo "WARNING: Comics.json does not exist."
          fi

          echo "Cleaning old application..."

          find "$PUBLISH_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name "Data" \
            -exec rm -rf {} +

          echo "Extracting new application..."

          tar \
            -xzf "$ARCHIVE" \
            -C "$PUBLISH_DIR"

          echo "Restoring Comics.json..."

          if [ -f "$BACKUP_DIR/Comics.json" ]; then

              mkdir -p "$PUBLISH_DIR/Data"

              cp \
                "$BACKUP_DIR/Comics.json" \
                "$PUBLISH_DIR/Data/Comics.json"

              echo "Comics.json restored."

          else

              echo "WARNING: No Comics.json backup available."

          fi

          echo "Setting permissions..."

          sudo chown -R hvc-comics:hvc-comics "$PUBLISH_DIR"

          echo "Starting application..."

          sudo systemctl start "$SERVICE"

          echo "Waiting for application..."

          sleep 5

          echo "Checking service..."

          if ! sudo systemctl is-active --quiet "$SERVICE"; then

              echo "ERROR: Service failed to start."

              echo ""
              echo "===== SYSTEMD STATUS ====="

              sudo systemctl status "$SERVICE" \
                --no-pager \
                --full || true

              echo ""
              echo "===== JOURNAL ====="

              sudo journalctl \
                -u "$SERVICE" \
                -n 100 \
                --no-pager || true

              exit 1
          fi

          echo "Service is running."

          echo "Checking Comics.json..."

          if [ -f "$PUBLISH_DIR/Data/Comics.json" ]; then

              echo "Comics.json exists."

              ls -lh "$PUBLISH_DIR/Data/Comics.json"

          else

              echo "ERROR: Comics.json is missing."

              exit 1

          fi

          echo "Cleaning temporary files..."

          rm -f "$ARCHIVE"
          rm -rf "$BACKUP_DIR"

          echo "=========================================="
          echo "Deployment completed successfully."
          echo "=========================================="

          REMOTE_SCRIPT
