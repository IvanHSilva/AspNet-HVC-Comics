name: Build and deploy ASP.NET Core app to AWS EC2 - HVC Comics

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore HVC-Comics/HVC-Comics.csproj

      - name: Build
        run: dotnet build HVC-Comics/HVC-Comics.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish HVC-Comics/HVC-Comics.csproj --configuration Release --no-build --output ./publish

      - name: Remove server data from artifact
        run: |
          rm -rf ./publish/Data

      - name: Create deployment archive
        run: |
          tar -czf hvc-comics.tar.gz -C ./publish .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: hvc-comics-publish
          path: hvc-comics.tar.gz


  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs: build

    permissions:
      contents: read

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: hvc-comics-publish

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.AWS_EC2_SSH_KEY }}" > ~/.ssh/hvc-comics-key
          chmod 600 ~/.ssh/hvc-comics-key

          ssh-keyscan -H "${{ secrets.AWS_EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload application
        run: |
          scp \
            -i ~/.ssh/hvc-comics-key \
            hvc-comics.tar.gz \
            "${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/tmp/hvc-comics.tar.gz"

      - name: Deploy application
        run: |
          ssh \
            -i ~/.ssh/hvc-comics-key \
            "${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -e

          APP_DIR="/opt/hvc-comics"
          PUBLISH_DIR="$APP_DIR/publish"
          BACKUP_DIR="/tmp/hvc-comics-backup"
          ARCHIVE="/tmp/hvc-comics.tar.gz"

          echo "=========================================="
          echo "HVC Comics - AWS deployment"
          echo "=========================================="

          echo "Stopping application..."

          sudo systemctl stop hvc-comics.service

          echo "Creating temporary backup directory..."

          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"

          echo "Preserving Comics.json..."

          if [ -f "$PUBLISH_DIR/Data/Comics.json" ]; then
              cp "$PUBLISH_DIR/Data/Comics.json" "$BACKUP_DIR/Comics.json"
          else
              echo "WARNING: Comics.json was not found."
          fi

          echo "Cleaning application files..."

          find "$PUBLISH_DIR" -mindepth 1 -maxdepth 1 \
            ! -name "Data" \
            -exec rm -rf {} +

          echo "Extracting new application..."

          tar -xzf "$ARCHIVE" -C "$PUBLISH_DIR"

          echo "Restoring Comics.json..."

          if [ -f "$BACKUP_DIR/Comics.json" ]; then

              mkdir -p "$PUBLISH_DIR/Data"

              cp \
                "$BACKUP_DIR/Comics.json" \
                "$PUBLISH_DIR/Data/Comics.json"

          fi

          echo "Setting ownership..."

          sudo chown -R hvc-comics:hvc-comics "$PUBLISH_DIR"

          echo "Starting application..."

          sudo systemctl start hvc-comics.service

          echo "Waiting for application..."

          sleep 5

          echo "Checking service status..."

          sudo systemctl is-active --quiet hvc-comics.service

          echo "Checking Comics.json..."

          if [ -f "$PUBLISH_DIR/Data/Comics.json" ]; then
              echo "Comics.json preserved successfully."
          else
              echo "ERROR: Comics.json is missing."
              exit 1
          fi

          echo "Cleaning temporary files..."

          rm -f "$ARCHIVE"
          rm -rf "$BACKUP_DIR"

          echo "=========================================="
          echo "Deployment completed successfully."
          echo "=========================================="

          REMOTE_SCRIPT
